<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вхід — Служба доставки В10</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#172238;background:#f6f8fb}main{background:white;padding:28px;border:1px solid #d8dfeb;border-radius:16px}h1{margin-top:0}label{display:block;margin-top:12px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #a5b2c7;border-radius:6px;font:inherit}button{padding:10px 14px;margin:10px 4px 0 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f8;padding:14px}textarea{font:12px monospace}small{display:block;color:#465570}#identity{overflow-wrap:anywhere}</style>
<main><h1>Служба доставки</h1><p>Лабораторна №2 · В10 · Власник і модератор</p>
<button id="google" disabled>Увійти через Google</button><button id="signout" hidden>Вийти</button>
<form id="password-form"><label>Електронна пошта<input id="email" type="email" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required minlength="6"></label><button id="password-login" disabled>Увійти з паролем</button><button id="register" type="button" disabled>Створити обліковий запис</button></form>
<p id="identity">Вхід ще не виконано.</p>
<details><summary>ID token для лабораторної перевірки</summary><small>Не публікуйте токен у звіті, чаті чи репозиторії.</small><textarea id="token" rows="5" readonly aria-label="Токен ідентичності"></textarea><button id="copy" disabled>Копіювати токен</button><button id="refresh" disabled>Оновити токен</button></details>
<label>Запит до API<input id="path" value="/api/parcels?status=доставлено&amp;city=Київ"></label><button id="call" disabled>Викликати API</button><pre id="out" role="status">Завантаження налаштувань Firebase…</pre></main><script type="module" src="/login.js"></script></html>
